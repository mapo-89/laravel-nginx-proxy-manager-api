# Dependency PRs are reviewed and retargeted at release preparation.
# Keep the default target; versioned release branches are deleted after publication.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Preserve existing Laravel/PHP compatibility when adding newer versions.
    versioning-strategy: widen
    commit-message:
      prefix: "📦 Deps"
    groups:
      composer-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "📦 Deps"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
